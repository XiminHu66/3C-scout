name: Refresh products and deploy

on:
  push:
    branches: [main]
  schedule:
    # 07:15 PST / 08:15 PDT in Seattle. GitHub cron uses UTC.
    - cron: "15 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 3c-scout-pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test feed parser
        run: python -m unittest discover -s tests -v

      - name: Fetch product feeds
        run: python scripts/fetch_products.py

      - name: Save refreshed data
        run: |
          if git diff --quiet -- data/products.json; then
            echo "No product data changed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/products.json
            git commit -m "data: refresh product feed"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
